<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NewsletterBand</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../tokens/tokens.css">
<style>*,*::before,*::after{box-sizing:border-box}
body{margin:0;padding:var(--space-3);background:var(--ground);color:var(--ink);font-family:var(--font-body);font-size:18px;line-height:30px}
h1,h2,h3,p{margin:0}
.hd{font:900 25px/30px var(--font-display);text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
.note{font-size:16px;line-height:24px;color:var(--ink-muted);margin-top:var(--space-3)}
a,button,input{font-family:inherit}
:focus-visible{outline:3px solid var(--black);outline-offset:2px;box-shadow:0 0 0 2px var(--white)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;font:900 19px/24px var(--font-display);text-transform:uppercase;letter-spacing:.02em;text-decoration:none;color:var(--white);background:var(--persimmon);border:2px solid var(--persimmon);border-radius:var(--radius-none);padding:var(--space-2) var(--space-4);cursor:pointer}
.btn:hover{background:var(--black);border-color:var(--black)}
.band{background:var(--black);color:var(--white);padding:var(--space-5);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:var(--space-5);align-items:center}
.band h2{margin-bottom:var(--space-2)}
.band p{font-size:18px;line-height:28px;max-width:38ch}
.band label{display:block;font:700 14px/20px var(--font-body);letter-spacing:.04em;text-transform:uppercase;margin-bottom:var(--space-1)}
.band input{width:100%;height:52px;font:400 18px/24px var(--font-body);color:var(--white);background:var(--black);border:3px solid var(--white);border-radius:var(--radius-none);padding:0 var(--space-3);margin-bottom:var(--space-2)}
.band .btn{width:100%}
.band .btn:hover{background:var(--white);border-color:var(--white);color:var(--black)}
.band :focus-visible{outline-color:var(--white);box-shadow:0 0 0 2px var(--black)}
</style></head><body style="padding:0">
<section class="band" aria-labelledby="nl">
<div><h2 class="hd" id="nl">Newsletter</h2><p>Sign up for our mailing list to get the latest news and updates.</p></div>
<form onsubmit="return false"><label for="em">Email address</label><input id="em" type="email" autocomplete="email" required><button class="btn" type="submit">Subscribe</button></form>
</section>
</body></html>
