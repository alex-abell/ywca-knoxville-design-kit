<style>*,*::before,*::after{box-sizing:border-box}
body{margin:0;padding:var(--space-3);background:var(--ground);color:var(--ink);font-family:var(--font-body);font-size:18px;line-height:30px}
h1,h2,h3,p{margin:0}
.hd{font:900 25px/30px var(--font-display);text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
.note{font-size:16px;line-height:24px;color:var(--ink-muted);margin-top:var(--space-3)}
a,button,input{font-family:inherit}
:focus-visible{outline:3px solid var(--black);outline-offset:2px;box-shadow:0 0 0 2px var(--white)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;font:900 19px/24px var(--font-display);text-transform:uppercase;letter-spacing:.02em;text-decoration:none;color:var(--white);background:var(--persimmon);border:2px solid var(--persimmon);border-radius:var(--radius-none);padding:var(--space-2) var(--space-4);cursor:pointer}
.btn:hover{background:var(--black);border-color:var(--black)}
.photo{position:relative;isolation:isolate;overflow:hidden;background:var(--persimmon);color:var(--white);display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start}
.photo img{position:absolute;inset:0;z-index:-2;width:100%;height:100%;object-fit:cover;filter:grayscale(1) brightness(1.3) contrast(1.05);mix-blend-mode:multiply}
.photo::after{content:"";position:absolute;inset:0;z-index:-1}
/* Two zones that never overlap: words on the left, the photo on the right. --words sets where the words zone ends. --focus points the crop at the face. */
.hero{--words:52%;min-height:clamp(340px,44vw,420px);padding:var(--space-5) 0}
.hero img{left:auto;right:0;width:min(calc(106% - var(--words)),1000px);object-position:var(--focus,70% 30%);-webkit-mask-image:linear-gradient(90deg,transparent 0,rgba(0,0,0,.1) 8%,rgba(0,0,0,.4) 20%,rgba(0,0,0,.8) 32%,#000 40%);mask-image:linear-gradient(90deg,transparent 0,rgba(0,0,0,.1) 8%,rgba(0,0,0,.4) 20%,rgba(0,0,0,.8) 32%,#000 40%)}
.hero h2{font:900 clamp(30px,5.6vw,56px)/1.05 var(--font-display);text-transform:uppercase;letter-spacing:.01em;padding-left:var(--space-5);margin-bottom:var(--space-3);max-width:var(--words);overflow-wrap:break-word}
.hero .strip{max-width:var(--words)}
@media (max-width:767px){
.hero{padding-top:0;min-height:0}
.hero img{position:relative;inset:auto;left:auto;width:100%;height:clamp(200px,56vw,360px);margin-bottom:var(--space-4);-webkit-mask-image:none;mask-image:none}
.hero h2,.hero .strip{max-width:100%}
}
.strip{background:var(--white);color:var(--black);font:900 clamp(24px,4vw,32px)/1.1 var(--font-display);text-transform:uppercase;letter-spacing:.01em;padding:var(--space-2) var(--space-5)}
.band{min-height:200px;padding:var(--space-5);margin-top:var(--space-3);justify-content:center}
.band::after{background:linear-gradient(90deg,var(--persimmon) max(20%,200px),transparent max(75%,340px))}
.band h2{max-width:max(50%,180px);overflow-wrap:break-word}
.note{padding:0 var(--space-3)}
</style></head><body style="padding:0">
