<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StatTile</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../tokens/tokens.css">
<style>*,*::before,*::after{box-sizing:border-box}
body{margin:0;padding:var(--space-3);background:var(--ground);color:var(--ink);font-family:var(--font-body);font-size:18px;line-height:30px}
h1,h2,h3,p{margin:0}
.hd{font:900 25px/30px var(--font-display);text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
.note{font-size:16px;line-height:24px;color:var(--ink-muted);margin-top:var(--space-3)}
a,button,input{font-family:inherit}
:focus-visible{outline:3px solid var(--black);outline-offset:2px;box-shadow:0 0 0 2px var(--white)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;font:900 19px/24px var(--font-display);text-transform:uppercase;letter-spacing:.02em;text-decoration:none;color:var(--white);background:var(--persimmon);border:2px solid var(--persimmon);border-radius:var(--radius-none);padding:var(--space-2) var(--space-4);cursor:pointer}
.btn:hover{background:var(--black);border-color:var(--black)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:var(--space-5);text-align:center}
.val{display:block;font:900 64px/64px var(--font-display);color:var(--persimmon);margin-bottom:var(--space-2);font-variant-numeric:tabular-nums}
.lab{display:block;font:700 20px/26px var(--font-body);text-wrap:balance}
.ctx{display:block;font-size:16px;line-height:24px;color:var(--ink-muted);margin-top:var(--space-1)}
.note{text-align:center}
</style></head><body>
<div class="tiles">
<p><span class="val">59%</span> <span class="lab">Exits to stable housing</span> <span class="ctx">95 of 162 women who left</span></p>
<p><span class="val">207</span> <span class="lab">Women served</span> <span class="ctx">January 2023 to October 2026</span></p>
<p><span class="val">52</span> <span class="lab">In the program today</span> <span class="ctx">as of October 31, 2026</span></p>
</div>
<p class="note">Sample numbers from invented practice data.</p>
</body></html>
